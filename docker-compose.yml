# MultiRegistrator: PostgreSQL only (measurements + application logs).
#
# The server and the client are desktop programs installed from their setup
# files.  The server connects to this database at 127.0.0.1:5433 (see
# config/server_config.json), so the administrator can add and configure
# devices in the server GUI.
#
#   docker compose up -d
#
# Connection: host=127.0.0.1  port=5433  db=multiregistrator
#             user=multiregistrator  password=multiregistrator

services:
  postgres:
    image: postgres:16-alpine
    container_name: multiregistrator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiregistrator}
      POSTGRES_USER: ${POSTGRES_USER:-multiregistrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multiregistrator}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiregistrator} -d ${POSTGRES_DB:-multiregistrator}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
